name: 24/7 Farm Telemetry Cloud Sync

on:
  schedule:
    # Runs automatically every 10 minutes 24/7/365 in the cloud
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  telemetry-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Requests
        run: |
          pip install requests

      - name: Run Cloud Telemetry Sync
        env:
          RAINPOINT_EMAIL: ${{ secrets.RAINPOINT_EMAIL || 'monkid_khtan@yahoo.com' }}
          RAINPOINT_PASSWORD: ${{ secrets.RAINPOINT_PASSWORD || '789789tan' }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL || 'https://kh-agrifarm-default-rtdb.asia-southeast1.firebasedatabase.app/telemetry.json' }}
        run: |
          python scripts/cloud_sync.py
